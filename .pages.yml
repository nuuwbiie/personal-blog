media:
  input: public/uploads
  output: /uploads
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    filename: "{primary}.md"
    view:
      fields: [title, published, draft]
      primary: title
      sort: [published, title]
      default:
        sort: published
        order: desc
    fields:
      - { name: title, label: Judul, type: string, required: true }
      - name: published
        label: Tanggal terbit
        type: date
        required: true
        options: { format: yyyy-MM-dd, time: false }
      - name: updated
        label: Terakhir diperbarui
        type: date
        options: { format: yyyy-MM-dd, time: false }
      - { name: draft, label: Simpan sebagai draft, type: boolean, default: true }
      - { name: description, label: Ringkasan, type: text, required: true }
      - { name: image, label: Gambar sampul, type: image }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: category, label: Kategori, type: string }
      - { name: lang, label: Bahasa, type: string, default: id }
      - { name: body, label: Isi tulisan, type: rich-text }
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, status, draft]
    fields:
      - { name: title, label: Nama proyek, type: string, required: true }
      - { name: description, label: Ringkasan, type: text, required: true }
      - name: status
        type: select
        options: { values: [Aktif, Selesai, Arsip] }
        default: Aktif
      - { name: url, label: Alamat proyek, type: string }
      - { name: order, label: Urutan, type: number, default: 0 }
      - { name: draft, label: Simpan sebagai draft, type: boolean, default: true }
      - { name: body, label: Cerita proyek, type: rich-text }
  - name: about
    label: About
    type: file
    path: src/content/spec/about.md
    fields:
      - { name: title, label: Judul, type: string, required: true }
      - { name: description, label: Ringkasan, type: text, required: true }
      - { name: body, label: Isi halaman, type: rich-text }
